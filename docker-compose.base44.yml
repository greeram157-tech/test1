# Base44 sandbox / preview environment.
#
# Runs the Vite dev server straight from the cloned source so every edit is
# reflected live in the preview. Dependencies are installed from the committed
# lockfile on container startup (node_modules lives in a named volume so the
# bind mount never shadows it).
services:
  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        CI=true npm ci --no-audit --no-fund
        exec npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    environment:
      # Passed through from the sandbox (never hardcoded) — see vite.config.ts.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      # Platform-managed secrets (e.g. VITE_CONTACT_ENDPOINT). Optional so the
      # stack still boots before any secret has been supplied.
      - path: /run/base44/app.env
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: on-failure

volumes:
  web_node_modules:
